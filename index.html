<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mi Plataformer</title>

    <link rel="stylesheet" href="./index.css">
</head>

<body>

    <h1>⚔️ MI PLATAFORMER</h1>

    <div id="info">

        ❤️ Vida:
        <span id="vida">5</span>

        &nbsp;&nbsp;

        🪙 Monedas:
        <span id="monedas">0</span>

        &nbsp;&nbsp;

        🏆 Nivel:
        <span id="nivel">1</span>

        &nbsp;&nbsp;

        🌊 Oleada:
        <span id="oleada">1</span>

    </div>

    <canvas
        id="game"
        width="1000"
        height="600">
    </canvas>

    <div id="controles">

        <b>A / D</b> Mover

        &nbsp; | &nbsp;

        <b>ESPACIO</b> Saltar

        &nbsp; | &nbsp;

        <b>J</b> Atacar

        &nbsp; | &nbsp;

        <b>K</b> Disparar

    </div>

    <div id="mensaje">
        NIVEL 1 - OLEADA 1
    </div>

    <!-- IMPORTANTE:
         este es el nombre REAL de tu archivo -->
    <script src="./index.javascript"></script>

</body>

</html>
