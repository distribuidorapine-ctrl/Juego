<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Plataformer</title>

    <link rel="stylesheet" href="./index.css">
</head>

<body>

    <h1>⚔️ MI PLATAFORMER</h1>

    <div id="info">
        ❤️ Vida: <span id="vida">5</span>
        &nbsp;&nbsp;
        🪙 Monedas: <span id="monedas">0</span>
        &nbsp;&nbsp;
        🏆 Nivel: <span id="nivel">1</span>
        &nbsp;&nbsp;
        🌊 Oleada: <span id="oleada">1</span>
    </div>

    <canvas id="game" width="1000" height="600"></canvas>

    <p id="controles">
        <b>A / D</b> Mover |
        <b>ESPACIO</b> Saltar |
        <b>J</b> Ataque |
        <b>K</b> Disparo
    </p>

    <div id="mensaje">¡Juego iniciado!</div>

    <script src="./index.javascript"></script>

</body>
</html>
