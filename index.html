<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Plataformer</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <header>
        <h1>⚔️ MI PLATAFORMER</h1>

        <div id="estado">
            <span>❤️ Vida: <b id="vida">5</b></span>
            <span>🪙 Monedas: <b id="monedas">0</b></span>
            <span>🌟 Nivel: <b id="nivel">1</b></span>
            <span>👾 Oleada: <b id="oleada">1</b></span>
        </div>

        <div id="mensaje">
            Preparando juego...
        </div>
    </header>

    <main>
        <canvas id="game" width="1000" height="600"></canvas>
    </main>

    <section id="controles">
        <span><b>A / D</b> Mover</span>
        <span><b>ESPACIO</b> Saltar</span>
        <span><b>J</b> Atacar</span>
        <span><b>K</b> Disparar</span>
    </section>

    <!-- IMPORTANTE: el archivo se llama index.js -->
    <script src="./index.js"></script>

</body>
</html>
